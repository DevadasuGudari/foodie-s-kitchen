<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Log in — Rangoli</title>


    <link
        href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Baloo+2:wght@500;600;700;800&family=Mukta:wght@400;500;600;700&family=Rajdhani:wght@500;600;700&display=swap"
        rel="stylesheet">

    <!-- Main CSS -->
    <link rel="stylesheet" href="../style.css">

</head>

<body>

    <div class="auth-page">

        <!-- LEFT SIDE -->
        <div class="auth-visual">

            <a href="../index.html" class="auth-brand">

                <span class="glyph"></span>

                Rangoli

            </a>

            <div class="auth-visual-content">

                <div class="section-eyebrow">
                    RANGOLI RESTAURANT
                </div>

                <h2>
                    Welcome back to
                    <span>Rangoli.</span>
                </h2>

                <p>
                    Your table, your favourites and your
                    Rangoli experience are just a login away.
                </p>

            </div>

        </div>


        <!-- RIGHT SIDE -->
        <div class="auth-panel">

            <div class="auth-card">

                <a href="../index.html" class="back-link">
                    &larr; Back to Rangoli
                </a>


                <div class="section-eyebrow">
                    Log in
                </div>


                <h1>
                    Welcome back
                </h1>


                <p class="auth-sub">
                    Log in to manage your reservations and
                    keep your Rangoli experience simple.
                </p>


                <!-- LOGIN FORM -->
                <form class="auth-form" action="mailto:hello@rangolikitchen.in" method="post" enctype="text/plain">


                    <div class="form-row">

                        <label for="login-email">
                            Email
                        </label>

                        <input type="email" id="login-email" name="Email" placeholder="Enter your email" required>

                    </div>


                    <div class="form-row">

                        <label for="login-password">
                            Password
                        </label>

                        <input type="password" id="login-password" name="Password" placeholder="Enter your password"
                            required>

                    </div>


                    <button type="submit" class="btn-primary full-width">

                        Log in

                    </button>

                </form>


                <p class="auth-switch">

                    New to Rangoli?

                    <a href="./signin.html">
                        Create an account
                    </a>

                </p>

            </div>

        </div>

    </div>

</body>

</html>
