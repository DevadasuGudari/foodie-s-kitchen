<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign up — Rangoli</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Baloo+2:wght@500;600;700;800&family=Mukta:wght@400;500;600;700&family=Rajdhani:wght@500;600;700&display=swap"
        rel="stylesheet">

    <!-- Main CSS -->
    <link rel="stylesheet" href="../style.css">

</head>

<body>

    <div class="auth-page">

        <!-- LEFT SIDE -->
        <div class="auth-visual">

            <a href="../index.html" class="auth-brand">

                <span class="glyph"></span>

                Rangoli

            </a>


            <div class="auth-visual-content">

                <div class="section-eyebrow">
                    RANGOLI RESTAURANT
                </div>

                <h2>
                    Make every visit
                    <span>special.</span>
                </h2>

                <p>
                    Create your Rangoli account and keep
                    your favourite dining moments in one place.
                </p>

            </div>

        </div>


        <!-- RIGHT SIDE -->
        <div class="auth-panel">

            <div class="auth-card">

                <a href="../index.html" class="back-link">
                    &larr; Back to Rangoli
                </a>


                <div class="section-eyebrow">
                    Sign up
                </div>


                <h1>
                    Join Rangoli
                </h1>


                <p class="auth-sub">
                    Create an account to manage your
                    reservations and keep your Rangoli
                    experience simple.
                </p>


                <!-- SIGNUP FORM -->
                <form class="auth-form" action="mailto:hello@rangolikitchen.in" method="post" enctype="text/plain">


                    <div class="form-row">

                        <label for="signup-name">
                            Name
                        </label>

                        <input type="text" id="signup-name" name="Name" placeholder="Enter your full name" required>

                    </div>


                    <div class="form-row">

                        <label for="signup-email">
                            Email
                        </label>

                        <input type="email" id="signup-email" name="Email" placeholder="Enter your email" required>

                    </div>


                    <div class="form-row two-col">

                        <div>

                            <label for="signup-phone">
                                Phone
                            </label>

                            <input type="tel" id="signup-phone" name="Phone" placeholder="+91 90000 00000" required>

                        </div>


                        <div>

                            <label for="signup-password">
                                Password
                            </label>

                            <input type="password" id="signup-password" name="Password"
                                placeholder="Minimum 6 characters" minlength="6" required>

                        </div>

                    </div>


                    <button type="submit" class="btn-primary full-width">

                        Create account

                    </button>

                </form>


                <p class="auth-switch">

                    Already have an account?

                    <a href="./login.html">
                        Log in
                    </a>

                </p>

            </div>

        </div>

    </div>

</body>

</html>
